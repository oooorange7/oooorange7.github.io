    <path d="M80 610 C 260 530, 420 730, 600 650 C 780 570, 940 750, 1120 650"/>
    <path d="M80 660 C 260 580, 420 780, 600 700 C 780 620, 940 800, 1120 700"/>
  </g>

  <g transform="translate(120,120)">
